  <text x="64" y="140" font-family="ui-monospace, Consolas, monospace" font-size="48" font-weight="700" fill="#e8ebf0">§03 · Using a pack</text>
  <text x="64" y="188" font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#c7ccd3">Ask a topic; the agent reads the right chapter</text>
  <rect x="56" y="230" width="1088" height="355" fill="#111113" stroke="#2a2d33"/>
  <rect x="56" y="230" width="1088" height="32" fill="#16171a"/>
  <text x="72" y="252" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#6b7078">INVOKE · SESSION</text>
  <text x="80" y="300" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#8b9099"># slash-invoke a pack by its slug</text>
  <text x="80" y="340" font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#e8ebf0">/sebok systems of systems</text>
  <text x="80" y="380" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#6b7078">  -&gt; routes SEBoK chapter; answers from notes</text>
  <text x="80" y="420" font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#e8ebf0">/nasa-se-handbook ch06</text>
  <text x="80" y="460" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#6b7078">  -&gt; loads chapter 06 directly into context</text>
  <line x1="48" y1="605" x2="1152" y2="605" stroke="#2a2d33"/>
  <text x="56" y="640" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#6b7078">INVOKE · PROGRESSIVE DISCLOSURE</text>
